name: Daily drop

on:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST every day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - categories.json
      - scripts/**
      - .github/workflows/daily.yml

permissions:
  contents: write

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's quotes
        env:
          TOKENHARBOR_API_KEY: ${{ secrets.TOKENHARBOR_API_KEY }}
          TOKENHARBOR_MODELS: ${{ vars.TOKENHARBOR_MODELS }}
        run: |
          set -o pipefail
          python scripts/generate.py 2>&1 | tee feed/v1/last_run.log

      - name: Commit
        if: always()
        run: |
          git config user.name "daily-drop-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Drop $(date -u +%F)"
            git push
          fi
